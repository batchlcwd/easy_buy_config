# Run on port 8080 to match Kubernetes routing configs
server.port=8088

# Database configuration
spring.datasource.url=jdbc:mysql://localhost:3306/micro_devops?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
